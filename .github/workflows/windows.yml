name: Windows Portable
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install ".[gui,dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Capture reference-size UI
        run: python scripts/capture_ui.py
      - name: Build portable ZIP
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ui-baseline
          path: artifacts/ui-baseline.png
      - uses: actions/upload-artifact@v4
        with:
          name: Pengunduh-YouTube-Massal-Windows-portable
          path: release/Pengunduh-YouTube-Massal-Windows-portable.zip
