name: Windows Portable
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install ".[gui,dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Capture and compare reference-size UI
        env:
          QT_QPA_PLATFORM: windows
        run: python scripts/capture_ui.py
      - name: Build portable ZIP
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: YouTube network diagnostic (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: python scripts\e2e_youtube_test.py --tools-dir "dist\Pengunduh YouTube Massal\tools"
      - uses: actions/upload-artifact@v7
        with:
          name: ui-baseline
          path: artifacts/*.png
      - uses: actions/upload-artifact@v7
        with:
          name: Pengunduh-YouTube-Massal-Windows-portable
          path: release/Pengunduh-YouTube-Massal-Windows-portable.zip
