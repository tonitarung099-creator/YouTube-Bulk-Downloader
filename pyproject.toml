[project]
name = "youtube-bulk-downloader"
version = "0.1.0"
description = "Windows-friendly bulk YouTube downloader with a Gemini natural-language intent layer."
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "yt-dlp",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
